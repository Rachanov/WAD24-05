<!-- static/index.html -->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLaMA Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <style>
        .chat-container {
            height: calc(100vh - 180px);
        }
        .message-container {
            max-height: calc(100vh - 250px);
        }
        .user-message {
            background-color: #e3f2fd;
        }
        .bot-message {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow-lg p-6 chat-container">
            <h1 class="text-2xl font-bold mb-4 text-center">LLaMA Chat</h1>
            
            <!-- Messages Container -->
            <div id="messages" class="message-container overflow-y-auto mb-4">
                <div class="bot-message p-3 rounded-lg mb-2">
                    สวัสดีครับ ผมคือ AI ผู้ช่วยของคุณ มีอะไรให้ช่วยไหมครับ?
                </div>
            </div>
            
            <!-- Input Form -->
            <form id="chatForm" class="flex gap-2">
                <input type="text" 
                       id="userInput" 
                       class="flex-1 p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
                       placeholder="พิมพ์ข้อความของคุณที่นี่..."
                       required>
                <button type="submit" 
                        class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-400">
                    ส่ง
                </button>
            </form>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('messages');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');

        function addMessage(message, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `${isUser ? 'user-message' : 'bot-message'} p-3 rounded-lg mb-2`;
            messageDiv.innerHTML = marked.parse(message);
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const message = userInput.value.trim();
            if (!message) return;
            
            // Add user message
            addMessage(message, true);
            
            // Clear input
            userInput.value = '';
            
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        max_length: 512,
                        temperature: 0.7
                    }),
                });
                
                const data = await response.json();
                if (data.status === 'error') {
                    addMessage('ขออภัย เกิดข้อผิดพลาดในการประมวลผล');
                } else {
                    addMessage(data.response);
                }
            } catch (error) {
                console.error('Error:', error);
                addMessage('ขออภัย เกิดข้อผิดพลาดในการเชื่อมต่อ');
            }
        });
    </script>
</body>
</html>
